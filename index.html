<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BEGA COFFEE | Saite's Luwak coffee</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f0e;
            --card-bg: #131715;
            --card-hover: #19201c;
            --border-color: #212c26;
            --accent: #2CB05F;
            --accent-hover: #34cf6e;
            --accent-light: #bbf2d0;
            --accent-sub: #1e7540;
            --text-main: #f5f5f5;
            --text-sub: #9da6a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: -0.015em;
            overflow-x: hidden;
        }

        /* 헤더 */
        header {
            background-color: rgba(13, 15, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 24px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo img {
            height: 36px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(44, 176, 95, 0.3));
        }

        .logo > div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            font-size: 10px;
            display: block;
            color: var(--text-sub);
            font-family: 'Playfair Display', serif;
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .notice {
            font-size: 12px;
            color: var(--accent-light);
            border: 1px solid rgba(44, 176, 95, 0.35);
            padding: 8px 18px;
            border-radius: 30px;
            background: rgba(44, 176, 95, 0.08);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 전체 컨테이너 */
        .container {
            max-width: 1400px;
            margin: 60px auto 100px;
            padding: 0 40px;
        }

        /* 카테고리 섹션 스타일 */
        .menu-section {
            margin-bottom: 80px;
        }

        .section-header {
            margin-bottom: 30px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title span {
            color: var(--accent);
        }

        .section-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--border-color) 40%, transparent 100%);
            opacity: 0.5;
        }

        /* 메뉴 그리드 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        .menu-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            cursor: pointer;
        }

        .menu-card:hover {
            background-color: var(--card-hover);
            border-color: rgba(44, 176, 95, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        }

        .tag {
            position: absolute;
            top: 28px;
            right: 32px;
            font-size: 10px;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1.5px;
            color: var(--accent-light);
            background: rgba(44, 176, 95, 0.15);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(44, 176, 95, 0.3);
            font-weight: 600;
            text-transform: uppercase;
        }

        .menu-card.new .tag {
            color: #4cd980;
            background: rgba(76, 217, 128, 0.12);
            border-color: rgba(76, 217, 128, 0.3);
        }

        .menu-name {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            padding-right: 70px;
            letter-spacing: -0.01em;
        }

        .menu-desc {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.65;
            margin-bottom: 24px;
            font-weight: 300;
        }

        .nutrition-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 12px;
            color: var(--text-sub);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 20px;
        }

        .card-click-guide {
            font-size: 11.5px;
            color: var(--accent);
            text-align: right;
            font-weight: 500;
            opacity: 0.85;
            letter-spacing: -0.2px;
            transition: opacity 0.2s;
        }

        .menu-card:hover .card-click-guide {
            opacity: 1;
            color: var(--accent-hover);
        }

        /* 팝업 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 5, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #111513;
            border: 1px solid rgba(44, 176, 95, 0.35);
            border-radius: 16px;
            width: 90%;
            max-width: 540px;
            padding: 36px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.85);
            position: relative;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.open .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.5px;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 4px;
        }

        .modal-close-btn:hover {
            color: var(--text-main);
        }

        .review-input-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .review-input-box input, 
        .review-input-box textarea {
            width: 100%;
            background: #080a09;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            font-size: 13.5px;
            transition: border-color 0.2s;
        }

        .review-input-box textarea {
            resize: none;
            height: 90px;
        }

        .review-input-box input:focus, 
        .review-input-box textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .review-submit-btn {
            background: var(--accent);
            border: none;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Pretendard', sans-serif;
            font-weight: 600;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .review-submit-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 15px rgba(44, 176, 95, 0.4);
        }

        .modal-review-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 280px;
            padding-right: 4px;
        }

        .modal-review-item {
            background: #080a09;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-review-item .r-content {
            flex: 1;
        }

        .modal-review-item .r-author {
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .modal-review-item .r-text {
            color: var(--text-sub);
            word-break: break-all;
            line-height: 1.5;
            font-weight: 300;
        }

        /* 푸터 */
        footer {
            background-color: #060807;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 50px 20px;
            font-size: 12px;
            color: var(--text-sub);
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
        }

        footer p {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <header>

                BEGA

                items: [
                    { name: "루왁아메리카노", tag: "", type: "", desc: "[기본 2샷] 특별한 루왁 추출 에스프레소에 정제수를 더해 풍부한 바디감과 깔끔함을 극대화한 아메리카노.", nutrition: "포화지방: 0.0g | 당류: 0.0g<br>나트륨: 1.5mg | 단백질: 1.0g" },
                    { name: "배가리카노", tag: "GRAND", type: "grand", desc: "[3샷] 깊고 진한 배가BGC커피 루왁아메리카노의 웅장한 풍미를 넉넉하게 즐길 수 있는 대용량 블랙.", nutrition: "포화지방: 0.0g | 당류: 0.0g<br>나트륨: 0.7mg | 단백질: 1.5g" },
                    { name: "루왁헤이즐넛아메리카노", tag: "", type: "", desc: "루왁아메리카노에 헤이즐넛의 은은한 아로마와 깔끔한 단맛을 결합해 세련되게 즐기는 커피.", nutrition: "포화지방: 0.0g | 당류: 15.8g<br>나트륨: 0.6mg | 단백질: 1.0g" },
                    { name: "루왁꿀아메리카노", tag: "", type: "", desc: "루왁아메리카노의 묵직한 바디감에 사양벌꿀의 부드러운 단맛이 스며들어 깊은 여운을 남기는 커피.", nutrition: "포화지방: 0.1g | 당류: 30.6g<br>나트륨: 7.2mg | 단백질: 0.9g" },
                    { name: "루왁바닐라아메리카노", tag: "", type: "", desc: "루왁아메리카노에 바닐라 노트를 더해 깔끔하면서도 향긋한 단맛의 밸런스를 구현한 커피.", nutrition: "포화지방: 0.1g | 당류: 20.2g<br>나트륨: 3.6mg | 단백질: 1.1g" }
                ]
            }
        ];

        let globalReviewsData = {};
        let currentActiveMenu = '';

        window.onload = function() {
            renderMenuSections();
            fetchAllReviews(); // 페이지 접속 시 서버에서 모든 리뷰 불러오기
        };

        // 서버(구글 스프레드시트)에서 전체 리뷰를 불러오는 함수
        function fetchAllReviews() {
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    globalReviewsData = {};
                    data.forEach(r => {
                        if (!globalReviewsData[r.menuName]) {
                            globalReviewsData[r.menuName] = [];
                        }
                        globalReviewsData[r.menuName].push({
                            id: r.id,
                            author: r.author,
                            text: r.text,
                            dateTime: r.dateTime
                        });
                    });
                    
                    // 최신순 정렬 (역순)
                    Object.keys(globalReviewsData).forEach(menu => {
                        globalReviewsData[menu].reverse();
                    });

                    // 만약 현재 모달이 열려있다면 화면 갱신
                    if (currentActiveMenu) {
                        renderModalReviews();
                    }
                })
                .catch(err => console.error('리뷰 불러오기 실패:', err));
        }

        // 카테고리별 메뉴 렌더링
        function renderMenuSections() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            menuCategories.forEach(category => {
                const section = document.createElement('div');
                section.className = 'menu-section';

                let cardsHtml = '';
                category.items.forEach(menu => {
                    let tagHtml = menu.tag ? `<span class="tag">${menu.tag}</span>` : '';
                    cardsHtml += `
                        <div class="menu-card ${menu.type === 'new' ? 'new' : ''}" onclick="openModal('${menu.name}')">
                            ${tagHtml}
                            <div>
                                <div class="menu-name">${menu.name}</div>
                                <div class="menu-desc">${menu.desc}</div>
                                <div class="nutrition-box">${menu.nutrition}</div>
                            </div>
                            <div class="card-click-guide">✨ 클릭해서 리뷰 확인하기@잇</div>
                        </div>
                    `;
                });

                section.innerHTML = `
                    <div class="section-header">
                        <div class="section-title"><span>✦</span> ${category.categoryTitle}</div>
                        <div style="font-size: 13.5px; color: var(--text-sub); margin-bottom: 12px; font-weight: 300;">${category.categoryDesc}</div>
                        <div class="section-divider"></div>
                    </div>
                    <div class="menu-grid">
                        ${cardsHtml}
                    </div>
                `;

                container.appendChild(section);
            });
        }

        // 모달 팝업 열기
        function openModal(menuName) {
            currentActiveMenu = menuName;
            document.getElementById('modalMenuName').textContent = menuName;
            document.getElementById('modalAuthor').value = '';
            document.getElementById('modalText').value = '';
            
            fetchAllReviews(); // 모달을 열 때 최신 데이터를 다시 서버에서 동기화
            document.getElementById('reviewModal').classList.add('open');
        }

        // 모달 팝업 닫기
        function closeModal() {
            document.getElementById('reviewModal').classList.remove('open');
            currentActiveMenu = '';
        }

        document.getElementById('reviewModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 리뷰 등록
        function submitModalReview() {
            const authorInput = document.getElementById('modalAuthor');
            const textInput = document.getElementById('modalText');
            
            const author = authorInput.value.trim();
            const text = textInput.value.trim();

            if (!author || !text) {
                alert('닉네임과 리뷰 모두 작성해주세요@옷 걱걱걱');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            const reviewData = {
                menuName: currentActiveMenu,
                author: author,
                text: text,
                dateTime: `${dateStr} ${timeStr}`,
                id: 'rev_' + Date.now() + Math.random().toString(36).substring(2, 9)
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reviewData)
            })
            .then(() => {
                authorInput.value = '';
                textInput.value = '';

                alert('리뷰가 등록되었다냥 사이테 사랑해 넌 내꼬얌 어흐어흐 츄베릅할쨕낼름쿰척와앙쭈왑으럇으럇탁탁탁탁탁');
                
                // 등록 후 서버 데이터를 다시 불러와서 화면 갱신
                setTimeout(fetchAllReviews, 1000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('리뷰 저장 중 오류가 생겨버려@엇');
            });
        }

        // 모달 내 리뷰 리스트 렌더링
        function renderModalReviews() {
            const listContainer = document.getElementById('modalReviewList');
            if (!listContainer) return;

            listContainer.innerHTML = '';
            const reviews = globalReviewsData[currentActiveMenu] || [];

            if (reviews.length === 0) {
                listContainer.innerHTML = `<div style="font-size:13px; color:#5c6661; text-align:center; padding: 30px; font-weight:300;">등록된 리뷰가 없다냥ㅠ 첫 리뷰를 달아보자냥!</div>`;
                return;
            }

            reviews.forEach(r => {
                const displayTime = r.dateTime || '';
                const item = document.createElement('div');
                item.className = 'modal-review-item';
                item.innerHTML = `
                    <div class="r-content">
                        <div class="r-author">${escapeHtml(r.author)} <span style="font-size:10px; color:#5c6661; font-weight:normal;">(${displayTime})</span></div>
                        <div class="r-text">${escapeHtml(r.text)}</div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // XSS 방지 헬퍼
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
