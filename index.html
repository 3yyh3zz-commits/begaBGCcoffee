<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BEGA COFFEE | Saite's Luwak coffee</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f0e;
            --card-bg: #131715;
            --card-hover: #19201c;
            --border-color: #212c26;
            --accent: #2CB05F;
            --accent-hover: #34cf6e;
            --accent-light: #bbf2d0;
            --text-main: #f5f5f5;
            --text-sub: #9da6a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Pretendard', sans-serif; letter-spacing: -0.015em; }

        header { background-color: rgba(13, 15, 14, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 24px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--accent); letter-spacing: 3px; display: flex; align-items: center; gap: 14px; }
        .logo img { height: 36px; }
        .notice { font-size: 12px; color: var(--accent-light); border: 1px solid rgba(44, 176, 95, 0.35); padding: 8px 18px; border-radius: 30px; background: rgba(44, 176, 95, 0.08); }
        .container { max-width: 1400px; margin: 60px auto 100px; padding: 0 40px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
        .menu-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 32px; cursor: pointer; transition: all 0.4s; }
        .menu-card:hover { background-color: var(--card-hover); border-color: rgba(44, 176, 95, 0.5); transform: translateY(-4px); }
        .menu-name { font-size: 19px; font-weight: 700; margin-bottom: 12px; }
        .menu-desc { font-size: 13.5px; color: var(--text-sub); margin-bottom: 24px; }

        /* 모달 */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(4, 6, 5, 0.88); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.open { display: flex; }
        .modal-content { background: #111513; border: 1px solid var(--accent); border-radius: 16px; width: 90%; max-width: 540px; padding: 36px; }
        .review-input-box { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .review-input-box input, .review-input-box textarea { width: 100%; background: #080a09; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: white; }
        .review-submit-btn { background: var(--accent); border: none; color: white; padding: 12px; border-radius: 8px; cursor: pointer; }
        .modal-review-list { max-height: 280px; overflow-y: auto; }
        .modal-review-item { background: #080a09; padding: 14px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><div>BEGA COFFEE</div></div>
        <div class="notice">✨ 100% Ass Luwak Essence</div>
    </header>

    <div class="container" id="menuContainer"></div>

    <div class="modal-overlay" id="reviewModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <div id="modalMenuName" style="color:var(--accent); font-size:20px; font-weight:bold;"></div>
                <button onclick="closeModal()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
            </div>
            <div class="review-input-box">
                <input type="text" id="modalAuthor" placeholder="닉네임">
                <textarea id="modalText" placeholder="리뷰를 남겨주세요"></textarea>
                <button class="review-submit-btn" onclick="submitModalReview()">등록하기</button>
            </div>
            <div class="modal-review-list" id="modalReviewList"></div>
        </div>
    </div>

    <script>
        // 수정된 스크립트 URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyXQ5b0djX-e1zWy9UTRuXTBBzM8EXJcLs9q6LWLI2R9RvRfs_iJKjJMVWMQilxfUSFiQ/exec';

        const menuItems = [
            { name: "루왁 퐁당 요거트 스무디" }, { name: "초당옥수수 뿡라페" }, { name: "꿀루왁주스" },
            { name: "루왁카페라떼" }, { name: "왕배가카페라떼" }, { name: "루왁아메리카노" }
        ];

        let globalReviewsData = {};
        let currentActiveMenu = '';

        window.onload = () => {
            const container = document.getElementById('menuContainer');
            menuItems.forEach(item => {
                container.innerHTML += `
                    <div class="menu-card" onclick="openModal('${item.name}')">
                        <div class="menu-name">${item.name}</div>
                        <div class="menu-desc">클릭하여 리뷰 보기</div>
                    </div>`;
            });
            fetchAllReviews();
        };

        function fetchAllReviews() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    globalReviewsData = {};
                    data.forEach(r => {
                        if (!globalReviewsData[r.menuName]) globalReviewsData[r.menuName] = [];
                        globalReviewsData[r.menuName].push(r);
                    });
                    if (currentActiveMenu) renderModalReviews();
                });
        }

        function openModal(menuName) {
            currentActiveMenu = menuName;
            document.getElementById('modalMenuName').textContent = menuName;
            fetchAllReviews();
            document.getElementById('reviewModal').classList.add('open');
        }

        function closeModal() { document.getElementById('reviewModal').classList.remove('open'); currentActiveMenu = ''; }

        function submitModalReview() {
            const author = document.getElementById('modalAuthor').value;
            const text = document.getElementById('modalText').value;
            if (!author || !text) return alert('내용을 입력하세요');

            const reviewData = { menuName: currentActiveMenu, author, text, dateTime: new Date().toLocaleString() };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reviewData)
            }).then(() => {
                alert('등록되었습니다');
                document.getElementById('modalAuthor').value = '';
                document.getElementById('modalText').value = '';
                setTimeout(fetchAllReviews, 1000);
            });
        }

        function renderModalReviews() {
            const list = document.getElementById('modalReviewList');
            list.innerHTML = '';
            const reviews = globalReviewsData[currentActiveMenu] || [];
            reviews.slice().reverse().forEach(r => {
                list.innerHTML += `<div class="modal-review-item"><strong>${r.author}</strong><br>${r.text}</div>`;
            });
        }
    </script>
</body>
</html>
