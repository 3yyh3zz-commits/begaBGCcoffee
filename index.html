<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BEGA COFFEE | Saite's Luwak coffee</title>
    <!-- 구글 폰트 및 스타일 유지 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f0e;
            --card-bg: #131715;
            --card-hover: #19201c;
            --border-color: #212c26;
            --accent: #2CB05F;
            --accent-hover: #34cf6e;
            --accent-light: #bbf2d0;
            --text-main: #f5f5f5;
            --text-sub: #9da6a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Pretendard', sans-serif; }

        /* 고급스러운 헤더 */
        header { padding: 40px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .logo { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--accent); letter-spacing: 4px; margin-bottom: 10px; }
        .notice { font-size: 13px; color: var(--text-sub); }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }

        /* 카드 디자인 유지 */
        .menu-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; cursor: pointer; transition: 0.3s; }
        .menu-card:hover { border-color: var(--accent); background: var(--card-hover); }
        .menu-name { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
        .menu-desc { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; }

        /* 모달 디자인 복구 */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 40px; border-radius: 20px; width: 90%; max-width: 500px; border: 1px solid var(--border-color); }
        .modal-header { font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 20px; }
        
        input, textarea { width: 100%; background: #000; border: 1px solid var(--border-color); padding: 15px; margin-bottom: 10px; color: white; border-radius: 8px; }
        button { background: var(--accent); border: none; padding: 15px; width: 100%; color: black; font-weight: bold; border-radius: 8px; cursor: pointer; }

        .review-list { margin-top: 20px; max-height: 200px; overflow-y: auto; font-size: 13px; }
        .review-item { padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <div class="logo">BEGA COFFEE</div>
        <div class="notice">최상급 루왁의 깊은 풍미를 경험하세요.</div>
    </header>

    <div class="container">
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <input type="text" id="name" placeholder="닉네임">
            <textarea id="text" placeholder="리뷰를 작성하세요"></textarea>
            <button onclick="submitReview()">등록하기</button>
            <div class="review-list" id="reviewList"></div>
            <button onclick="closeModal()" style="margin-top:20px; background:transparent; color:white; border:1px solid #444;">닫기</button>
        </div>
    </div>

    <script>
        // 새로 발급받으신 주소입니다.
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyXQ5b0djX-e1zWy9UTRuXTBBzM8EXJcLs9q6LWLI2R9RvRfs_iJKjJMVWMQilxfUSFiQ/exec';

        const menus = ["루왁 퐁당 요거트 스무디", "초당옥수수 뿡라페", "꿀루왁주스", "루왁카페라떼", "왕배가카페라떼", "루왁아메리카노"];
        
        // 메뉴 그리기
        const grid = document.getElementById('menuGrid');
        menus.forEach(m => {
            grid.innerHTML += `<div class="modal-open menu-card" onclick="openModal('${m}')">
                <div class="menu-name">${m}</div>
                <div class="menu-desc">클릭하여 리뷰 확인 및 작성</div>
            </div>`;
        });

        let currentMenu = "";
        function openModal(name) {
            currentMenu = name;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modal').style.display = 'flex';
            loadReviews(name);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function submitReview() {
            const data = {
                menuName: currentMenu,
                author: document.getElementById('name').value,
                text: document.getElementById('text').value
            };
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
                .then(() => { alert('등록됨'); loadReviews(currentMenu); });
        }

        function loadReviews(menuName) {
            fetch(scriptURL)
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('reviewList');
                    list.innerHTML = "";
                    data.filter(d => d.menuName === menuName).forEach(d => {
                        list.innerHTML += `<div class="review-item"><strong>${d.author}</strong>: ${d.text}</div>`;
                    });
                });
        }
    </script>
</body>
</html>
