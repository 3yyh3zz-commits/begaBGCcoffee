<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BEGA COFFEE | Saite's Luwak coffee</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f0e;
            --card-bg: #131715;
            --card-hover: #19201c;
            --border-color: #212c26;
            --accent: #2CB05F;
            --accent-hover: #34cf6e;
            --accent-light: #bbf2d0;
            --text-main: #f5f5f5;
            --text-sub: #9da6a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Pretendard', sans-serif; letter-spacing: -0.015em; overflow-x: hidden; }

        header { background-color: rgba(13, 15, 14, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 24px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--accent); letter-spacing: 3px; display: flex; align-items: center; gap: 14px; }
        .logo span { font-size: 10px; display: block; color: var(--text-sub); letter-spacing: 3px; margin-top: 4px; text-transform: uppercase; }
        .notice { font-size: 12px; color: var(--accent-light); border: 1px solid rgba(44, 176, 95, 0.35); padding: 8px 18px; border-radius: 30px; background: rgba(44, 176, 95, 0.08); font-weight: 500; }
        .container { max-width: 1400px; margin: 60px auto 100px; padding: 0 40px; }
        .menu-section { margin-bottom: 80px; }
        .section-header { margin-bottom: 30px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--text-main); font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 15px; }
        .section-title span { color: var(--accent); }
        .section-divider { width: 100%; height: 1px; background: linear-gradient(90deg, var(--accent) 0%, var(--border-color) 40%, transparent 100%); opacity: 0.5; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
        .menu-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; cursor: pointer; }
        .menu-card:hover { background-color: var(--card-hover); border-color: rgba(44, 176, 95, 0.5); transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7); }
        .tag { position: absolute; top: 28px; right: 32px; font-size: 10px; font-family: 'Playfair Display', serif; letter-spacing: 1.5px; color: var(--accent-light); background: rgba(44, 176, 95, 0.15); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(44, 176, 95, 0.3); font-weight: 600; text-transform: uppercase; }
        .menu-name { font-size: 19px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; padding-right: 70px; }
        .menu-desc { font-size: 13.5px; color: var(--text-sub); line-height: 1.65; margin-bottom: 24px; font-weight: 300; }
        .nutrition-box { background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 14px 16px; font-size: 12px; color: var(--text-sub); display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; border: 1px solid rgba(255, 255, 255, 0.02); margin-bottom: 20px; }
        .card-click-guide { font-size: 11.5px; color: var(--accent); text-align: right; font-weight: 500; }

        /* 팝업 모달 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 6, 5, 0.88); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.open { display: flex; }
        .modal-content { background: #111513; border: 1px solid rgba(44, 176, 95, 0.35); border-radius: 16px; width: 90%; max-width: 600px; padding: 36px; box-shadow: 0 25px 60px rgba(0,0,0,0.85); display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
        .modal-title { font-size: 22px; font-weight: 700; color: var(--accent); font-family: 'Playfair Display', serif; }
        .modal-close-btn { background: transparent; border: none; color: var(--text-sub); font-size: 22px; cursor: pointer; }
        
        /* Utterances 댓글창이 들어갈 공간 */
        .modal-review-container { flex: 1; overflow-y: auto; margin-top: 10px; }

        footer { background-color: #060807; border-top: 1px solid var(--border-color); text-align: center; padding: 50px 20px; font-size: 12px; color: var(--text-sub); font-family: 'Playfair Display', serif; letter-spacing: 2px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div>BEGA COFFEE</div>
            <span>Saite's Luwak coffee</span>
        </div>
        <div class="notice">✨ 100% Ass Luwak Essence</div>
    </header>

    <div class="container" id="menuContainer"></div>

    <div class="modal-overlay" id="reviewModal">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="modalMenuName">메뉴 이름</div>
                <button class="modal-close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <!-- 여기에 다른 사람들과 완벽하게 공유되는 실시간 댓글창이 꽂힙니다 -->
            <div class="modal-review-container" id="utterancesContainer"></div>
        </div>
    </div>

    <footer>
        <p>BEGA COFFEE - Saite's Luwak coffee</p>
        <p style="color: #555; font-size: 11px; margin-top: 10px;">&copy; 2026 BEGA COFFEE. All Rights Reserved.</p>
    </footer>

    <script>
        // 우클릭 및 F12 차단 유지
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault(); e.stopPropagation(); return false;
            }
        });

        const menuCategories = [
            {
                categoryTitle: "Signature & Special",
                categoryDesc: "배가커피만의 독창적인 감성과 최상급 루왁 원액을 담아낸 시그니처 및 시즌 한정 컬렉션입니다.",
                items: [
                    { name: "루왁 퐁당 요거트 스무디", tag: "NEW", desc: "루왁의 풍미를 듬뿍 담아 과일 본연의 달콤함을 살리고 상큼한 요거트를 더한 스무디.", nutrition: "포화지방: 2.8g | 당류: 100.3g<br>나트륨: 97.9mg | 단백질: 6.2g" },
                    { name: "초당옥수수 뿡라페", tag: "NEW", desc: "여름 제철 초당옥수수의 달콤함과 톡톡 씹히는 루왁을 담아 고소하게 완성한 라페.", nutrition: "포화지방: 4.6g | 당류: 87.8g<br>나트륨: 550.1mg | 단백질: 9.0g" },
                    { name: "꿀루왁주스", tag: "NEW", desc: "100% 루왁 착즙원액에 달콤한 꿀을 더해 진한 풍미를 살린 시즌 대표 주스 메뉴.", nutrition: "포화지방: 0.1g | 당류: 32.3g<br>나트륨: 10.0mg | 단백질: 1.8g" },
                    { name: "제로 루왁말차 아이스티", tag: "NEW", desc: "말차와 루왁의 산뜻한 조화에 식이섬유를 더해 칼로리 부담 없이 즐기는 제로 아이스티.", nutrition: "포화지방: 0.1g | 당류: 0.0g<br>나트륨: 203.9mg | 단백질: 0.2g" },
                    { name: "루왁쉐이크", tag: "BEST", desc: "루왁의 묵직한 바디감에 달콤함을 더해 꾸덕하고 진한 풍미를 선사하는 쉐이크.", nutrition: "포화지방: 4.1g | 당류: 62.4g<br>나트륨: 308.2mg | 단백질: 8.9g" },
                    { name: "루왁초코젤라또 말차라떼", tag: "ONLY", desc: "진하고 꾸덕한 초코 젤라또를 고품질 말차, 루왁에스프레소와 함께 블렌딩한 라떼.", nutrition: "포화지방: 5.1g | 당류: 46.8g<br>나트륨: 82.4mg | 단백질: 10.1g" }
                ]
            },
            {
                categoryTitle: "Latte & Milk Collection",
                categoryDesc: "고결한 루왁 에스프레소와 부드러운 우유가 섬세한 조화를 이루는 라떼 라인업입니다.",
                items: [
                    { name: "루왁카페라떼", tag: "", desc: "[기본 2샷] 갓 뽑은 루왁 에스프레소와 부드러운 우유가 어우러진 라떼.", nutrition: "포화지방: 3.8g | 당류: 9.2g<br>나트륨: 88.5mg | 단백질: 8.5g" },
                    { name: "왕배가카페라떼", tag: "GRAND", desc: "[3샷] 진한 루왁 에스프레소와 우유로 깊은 여운을 전하는 시그니처 대용량 라떼.", nutrition: "포화지방: 7.1g | 당류: 28.4g<br>나트륨: 136.2mg | 단백질: 15g" },
                    { name: "루왁연유라떼", tag: "", desc: "루왁 에스프레소 샷, 부드러운 우유 그리고 달콤한 연유가 조화로운 밀키 라떼.", nutrition: "포화지방: 6.4g | 당류: 32.8g<br>나트륨: 144.6mg | 단백질: 13.0g" },
                    { name: "루왁아메리카노", tag: "", desc: "[기본 2샷] 깔끔함과 풍부한 바디감을 극대화한 아메리카노.", nutrition: "포화지방: 0.0g | 당류: 0.0g<br>나트륨: 1.5mg | 단백질: 1.0g" },
                    { name: "배가리카노", tag: "GRAND", desc: "[3샷] 웅장한 풍미를 넉넉하게 즐길 수 있는 대용량 블랙.", nutrition: "포화지방: 0.0g | 당류: 0.0g<br>나트륨: 0.7mg | 단백질: 1.5g" }
                ]
            }
        ];

        window.onload = function() {
            renderMenuSections();
        };

        function renderMenuSections() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            menuCategories.forEach(category => {
                const section = document.createElement('div');
                section.className = 'menu-section';

                let cardsHtml = '';
                category.items.forEach(menu => {
                    let tagHtml = menu.tag ? `<span class="tag">${menu.tag}</span>` : '';
                    cardsHtml += `
                        <div class="menu-card" onclick="openModal('${menu.name}')">
                            ${tagHtml}
                            <div>
                                <div class="menu-name">${menu.name}</div>
                                <div class="menu-desc">${menu.desc}</div>
                                <div class="nutrition-box">${menu.nutrition}</div>
                            </div>
                            <div class="card-click-guide">✨ 클릭해서 실시간 리뷰 보기@잇</div>
                        </div>
                    `;
                });

                section.innerHTML = `
                    <div class="section-header">
                        <div class="section-title"><span>✦</span> ${category.categoryTitle}</div>
                        <div style="font-size: 13.5px; color: var(--text-sub); margin-bottom: 12px; font-weight: 300;">${category.categoryDesc}</div>
                        <div class="section-divider"></div>
                    </div>
                    <div class="menu-grid">${cardsHtml}</div>
                `;
                container.appendChild(section);
            });
        }

        function openModal(menuName) {
            document.getElementById('modalMenuName').textContent = menuName;
            
            const container = document.getElementById('utterancesContainer');
            container.innerHTML = ''; // 이전 메뉴 댓글창 초기화

            // Utterances 스크립트 동적 생성
            const scriptEl = document.createElement('script');
            scriptEl.src = 'https://utteranc.es/client.js';
            scriptEl.async = true;
            scriptEl.crossOrigin = 'anonymous';
            
            // 👇 [중요] 여기에 본인의 깃허브 아이디와 저장소 이름을 넣으세요!
            scriptEl.setAttribute('repo', '3yyh3zz-commits/begaBGCcoffee'); 
            
            scriptEl.setAttribute('issue-term', 'pathname');
            scriptEl.setAttribute('label', 'review');
            scriptEl.setAttribute('theme', 'github-dark'); // 사이트 디자인과 어울리는 다크 테마

            // 메뉴 이름별로 고유한 이슈(댓글 공간)가 매핑되도록 설정
            scriptEl.setAttribute('state', menuName);

            container.appendChild(scriptEl);
            document.getElementById('reviewModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('reviewModal').classList.remove('open');
        }

        document.getElementById('reviewModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
